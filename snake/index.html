<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slay the Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo"><span>Slay</span> the Snake</div>
      <div class="subtitle">Night Edition</div>
    </div>

    <div class="scorebar">
      <div class="score-item">
        <div class="score-label">Score</div>
        <div class="score-val" id="scoreVal">0</div>
      </div>
      <div id="speedBar">
        <div class="sp" id="sp0"></div>
        <div class="sp" id="sp1"></div>
        <div class="sp" id="sp2"></div>
        <div class="sp" id="sp3"></div>
        <div class="sp" id="sp4"></div>
      </div>
      <div class="score-item">
        <div class="score-label">Best</div>
        <div class="score-val hi" id="hiVal">0</div>
      </div>
    </div>

    <div class="arena">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="ov-title" id="ovTitle">Slay the Snake</div>
        <div class="ov-sub" id="ovSub">Press ENTER or tap to start</div>
        <div class="btn-row">
          <button class="btn btn-primary" id="mainBtn">Start Game</button>
        </div>
        <div class="hint" id="ovHint">Arrow keys to move · Space to restart</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="resetHiBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset Highscore
      </button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
